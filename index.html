<!DOCTYPE html>
<html>
<head>
  <title>Live Bikepacking Tracker</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial; }

    #map { height: 100vh; }

    /* 📱 Mobile HUD only */
    #hud {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }

    @media (max-width: 768px) {
      #hud {
        display: block;
        width: calc(100% - 20px);
      }
    }

    /* Loading screen */
    #loading {
      position: absolute;
      z-index: 9999;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 18px;
    }

    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(255,255,255,0.9);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div id="loading">
  📡 Waiting for GPS signal...
</div>

<div id="info">
  <div><b>Status:</b> <span id="status">loading</span></div>
  <div><b>Last update:</b> <span id="lastUpdate">-</span></div>
  <div><b>Battery:</b> <span id="battery">-</span></div>
</div>

<!-- 📱 Mobile HUD -->
<div id="hud">
  🚴 Speed: <span id="speed">-</span> km/h<br>
  📏 Distance: <span id="distance">-</span> km<br>
  ⏱️ Last seen: <span id="lastSeen">-</span>
</div>

<div id="map"></div>

<script>

// 🗺️ MAP INIT
const map = L.map('map').setView([45, 25], 5);

// Layers
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

satellite.addTo(map);

L.control.layers({
  "Map": street,
  "Satellite": satellite
}).addTo(map);

// 🔴 SPOT FEED
const SPOT_URL =
  "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

let marker;
let trackLine = L.polyline([], { color: 'red', weight: 4 }).addTo(map);
let firstLoad = true;

// 📏 distance function
function getDistance(a, b) {
  const R = 6371;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;

  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

// 🟢 ROUTE LOAD (KML)
fetch("route.kml")
  .then(res => res.text())
  .then(kmlText => {
    const parser = new DOMParser();
    const kml = parser.parseFromString(kmlText, "text/xml");

    const coords = kml.getElementsByTagName("coordinates");

    let latlngs = [];
    let elevations = [];

    for (let c of coords) {
      let points = c.textContent.trim().split(" ");

      points.forEach(p => {
        let parts = p.split(",");
        let lng = parts[0];
        let lat = parts[1];
        let ele = parts[2];

        if (lat && lng) {
          latlngs.push([parseFloat(lat), parseFloat(lng)]);
        }

        if (ele) elevations.push(parseFloat(ele));
      });
    }

    if (latlngs.length > 0) {
      const route = L.polyline(latlngs, {
        color: 'blue',
        weight: 3,
        opacity: 0.7
      }).addTo(map);

      map.fitBounds(route.getBounds());
    }

    if (elevations.length > 0) {
      console.log("Elevation min/max:", Math.min(...elevations), Math.max(...elevations));
    }
  });

// 🔄 UPDATE LOOP
async function updateTrack() {
  try {
    const res = await fetch(SPOT_URL);
    const text = await res.text();

    const xml = new DOMParser().parseFromString(text, "text/xml");
    const messages = xml.getElementsByTagName("message");

    let latlngs = [];
    let lastTime = null;
    let battery = null;

    for (let msg of messages) {
      let lat = msg.getElementsByTagName("latitude")[0]?.textContent;
      let lon = msg.getElementsByTagName("longitude")[0]?.textContent;
      let time = msg.getElementsByTagName("dateTime")[0]?.textContent;
      let bat = msg.getElementsByTagName("batteryState")[0]?.textContent;

      if (lat && lon) {
        latlngs.push([parseFloat(lat), parseFloat(lon)]);
      }

      if (time && !lastTime) lastTime = time;
      if (bat) battery = bat;
    }

    if (latlngs.length === 0) return;

    latlngs.reverse();

    trackLine.setLatLngs(latlngs);

    const latest = latlngs[latlngs.length - 1];

    if (!marker) {
      marker = L.marker(latest).addTo(map);
    } else {
      marker.setLatLng(latest);
    }

    // center only once
    if (firstLoad) {
      map.setView(latest, 10);
      firstLoad = false;
      document.getElementById("loading").style.display = "none";
    }

    // -----------------------
    // 📏 DISTANCE + SPEED
    // -----------------------
    let totalDistance = 0;

    for (let i = 1; i < latlngs.length; i++) {
      totalDistance += getDistance(latlngs[i-1], latlngs[i]);
    }

    let speed = 0;
    if (latlngs.length > 1) {
      const a = latlngs[latlngs.length - 2];
      const b = latlngs[latlngs.length - 1];

      const dist = getDistance(a, b);

      const assumedTimeHours = 5 / 60; // SPOT typical interval
      speed = dist / assumedTimeHours;
    }

    // -----------------------
    // ⏱️ LAST SEEN
    // -----------------------
    let lastSeenText = "-";

    if (lastTime) {
      const diff = (Date.now() - new Date(lastTime).getTime()) / 60000;
      lastSeenText = Math.floor(diff) + " min ago";

      document.getElementById("lastUpdate").textContent =
        new Date(lastTime).toLocaleString();
    }

    // -----------------------
    // UI UPDATE
    // -----------------------
    document.getElementById("status").textContent = "live";
    document.getElementById("battery").textContent = battery || "-";

    document.getElementById("speed").textContent = speed.toFixed(1);
    document.getElementById("distance").textContent = totalDistance.toFixed(2);
    document.getElementById("lastSeen").textContent = lastSeenText;

  } catch (e) {
    console.error(e);
    document.getElementById("status").textContent = "error";
  }
}

setInterval(updateTrack, 30000);
updateTrack();

</script>

</body>
</html>
