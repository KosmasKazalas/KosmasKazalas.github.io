<!DOCTYPE html>
<html>
<head>
    <title>Cross Peloponnese 2026</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 450px;
        }

        #stats-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        #elevation-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            height: 160px;
            backdrop-filter: blur(5px);
        }

        .stat-item { border-left: 3px solid #007bff; padding-left: 8px; }
        .label { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 14px; color: #111; font-weight: 800; display: block; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-container">
    <div id="elevation-box">
        <canvas id="elevationChart"></canvas>
    </div>

    <div id="stats-box">
        <div class="stat-item"><span class="label">Speed (est)</span><span id="speed-val" class="value">-- km/h</span></div>
        <div class="stat-item"><span class="label">Distance Covered</span><span id="dist-val" class="value">-- km</span></div>
        <div class="stat-item" style="grid-column: span 2;"><span class="label">Latest Coordinates</span><span id="coord-val" class="value">Waiting for GPS...</span></div>
        <div class="stat-item"><span class="label">Last Update</span><span id="time-val" class="value">--:--</span></div>
        <div class="stat-item"><span class="label">Battery Status</span><span id="batt-val" class="value">--</span></div>
    </div>
</div>

<script>
// --- 1. Map Setup ---
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
const map = L.map('map', { zoomControl: true, layers: [satellite] });
L.control.layers({ "Satellite": satellite, "Street": street }).addTo(map);

let liveMarker;
let hoverMarker = L.circleMarker([0,0], { radius: 7, color: '#ff4444', fillColor: 'white', fillOpacity: 1, weight: 3, zIndexOffset: 2000 }).addTo(map);

let plannedRouteLine = L.polyline([], { color: '#ff4444', weight: 4, opacity: 0.7 }).addTo(map);
let breadcrumbLine = L.polyline([], { color: '#007bff', weight: 5, opacity: 0.9 }).addTo(map);

let elevationChart;
let routeData = [];

const SPOT_URL = "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

// --- 2. Load KML & Distance Tracking ---
fetch("route.kml")
    .then(res => res.text())
    .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(kmlText, "text/xml");
        const coordsStr = kml.getElementsByTagName("coordinates")[0].textContent.trim();
        
        let accumulatedDist = 0;
        routeData = coordsStr.split(/\s+/).map((p, i, arr) => {
            const [lng, lat, ele] = p.split(",").map(Number);
            
            // Calculate distance for the X-axis of the graph
            if (i > 0) {
                const prev = arr[i-1].split(",").map(Number);
                accumulatedDist += L.latLng(lat, lng).distanceTo(L.latLng(prev[1], prev[0]));
            }

            return { lat, lng, ele, dist: (accumulatedDist / 1000).toFixed(1) };
        });

        if(routeData.length > 0) {
            plannedRouteLine.setLatLngs(routeData.map(p => [p.lat, p.lng]));
            initChart();
            
            // 2. CENTER & ZOOM TO ROUTE ON LOAD
            map.fitBounds(plannedRouteLine.getBounds(), { padding: [20, 20] });
        }
    });

function initChart() {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    const elevations = routeData.map(p => p.ele);
    const distances = routeData.map(p => p.dist);
    const maxEle = Math.max(...elevations);
    
    elevationChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: distances, // 3. Use KM for the labels
            datasets: [{
                data: elevations,
                borderColor: '#ff4444',
                backgroundColor: 'rgba(255, 68, 68, 0.1)',
                fill: true,
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: { 
                x: { display: false }, 
                y: { 
                    min: 0, 
                    suggestedMax: maxEle + 20,
                    ticks: { color: '#666', font: { size: 9 }, stepSize: Math.ceil(maxEle / 4) } 
                } 
            },
            plugins: { 
                legend: { display: false },
                tooltip: {
                    enabled: true,
                    displayColors: false,
                    callbacks: {
                        // 3. Show Elevation and KM in the hover box
                        title: (items) => `Distance: ${items[0].label} km`,
                        label: (context) => `Elevation: ${context.parsed.y} m`
                    }
                }
            },
            onHover: (e, el) => {
                if (el.length > 0) {
                    const index = el[0].index;
                    const p = routeData[index];
                    hoverMarker.setLatLng([p.lat, p.lng]);
                }
            }
        }
    });
}

// --- 3. Live Tracking ---
async function updateTrack() {
    try {
        const res = await fetch(SPOT_URL);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const messages = Array.from(xml.getElementsByTagName("message"));
        
        if (messages.length === 0) {
            document.getElementById('coord-val').innerText = "No data in feed";
            return;
        }

        // 1. Parse all points (Oldest to Newest)
        const allPoints = messages.map(msg => ({
            lat: parseFloat(msg.getElementsByTagName("latitude")[0].textContent),
            lng: parseFloat(msg.getElementsByTagName("longitude")[0].textContent),
            time: new Date(msg.getElementsByTagName("dateTime")[0].textContent),
            battery: msg.getElementsByTagName("batteryState")[0]?.textContent || "GOOD"
        })).reverse();

        const latest = allPoints[allPoints.length - 1];

        // 2. ALWAYS Update Latest Marker & General Stats
        if (!liveMarker) {
            liveMarker = L.marker([latest.lat, latest.lng]).addTo(map).bindPopup("Latest Position");
        } else {
            liveMarker.setLatLng([latest.lat, latest.lng]);
        }

        document.getElementById('coord-val').innerText = `${latest.lat.toFixed(5)}, ${latest.lng.toFixed(5)}`;
        document.getElementById('time-val').innerText = latest.time.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('batt-val').innerText = latest.battery;

        // 3. START GATE LOGIC (Kalamata)
        const startPoint = L.latLng(37.020374, 22.143312); 
        let hasReachedStart = false;
        
        const validHistory = allPoints.filter(p => {
            const distFromStart = L.latLng(p.lat, p.lng).distanceTo(startPoint);
            if (distFromStart < 2000) hasReachedStart = true; 
            return hasReachedStart;
        });

        // 4. Update Blue Breadcrumbs & Distance
        if (validHistory.length > 0) {
            breadcrumbLine.setLatLngs(validHistory.map(p => [p.lat, p.lng]));
            
            let totalDist = 0;
            for(let i=0; i < validHistory.length - 1; i++) {
                totalDist += L.latLng(validHistory[i].lat, validHistory[i].lng)
                              .distanceTo(L.latLng(validHistory[i+1].lat, validHistory[i+1].lng));
            }
            document.getElementById('dist-val').innerText = (totalDist / 1000).toFixed(1) + " km";
        } else {
            // Still in Athens or on the bus
            breadcrumbLine.setLatLngs([]);
            document.getElementById('dist-val').innerText = "0.0 km (Not Started)";
        }

        // 5. Speed Estimation (always active)
        if (allPoints.length > 1) {
            const p1 = allPoints[allPoints.length - 1];
            const p2 = allPoints[allPoints.length - 2];
            const hrs = Math.abs(p1.time - p2.time) / 36e5;
            const km = L.latLng(p1.lat, p1.lng).distanceTo(L.latLng(p2.lat, p2.lng)) / 1000;
            document.getElementById('speed-val').innerText = (hrs > 0 && hrs < 2) ? (km/hrs).toFixed(1) + " km/h" : "0.0 km/h";
        }

    } catch (e) { 
        console.error("Update Error:", e);
        document.getElementById('coord-val').innerText = "Connection Error";
    }
}
setInterval(updateTrack, 60000);
updateTrack();
</script>
</body>
</html>
