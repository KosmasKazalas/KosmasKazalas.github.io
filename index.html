<!DOCTYPE html>
<html>
<head>
    <title>Cross Peloponnese 2026</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 450px;
        }

        #stats-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        #elevation-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            height: 140px;
            backdrop-filter: blur(5px);
        }

        .stat-item { border-left: 3px solid #007bff; padding-left: 8px; }
        .label { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 14px; color: #111; font-weight: 800; display: block; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-container">
    <div id="elevation-box">
        <canvas id="elevationChart"></canvas>
    </div>

    <div id="stats-box">
        <div class="stat-item">
            <span class="label">Speed (est)</span>
            <span id="speed-val" class="value">-- km/h</span>
        </div>
        <div class="stat-item">
            <span class="label">Distance Traveled</span>
            <span id="dist-val" class="value">-- km</span>
        </div>
        <div class="stat-item" style="grid-column: span 2;">
            <span class="label">Latest Coordinates</span>
            <span id="coord-val" class="value">Waiting for GPS...</span>
        </div>
        <div class="stat-item">
            <span class="label">Last Update</span>
            <span id="time-val" class="value">--:--</span>
        </div>
        <div class="stat-item">
            <span class="label">Battery Status</span>
            <span id="batt-val" class="value">--</span>
        </div>
    </div>
</div>

<script>
// --- 1. Map & Layers ---
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const map = L.map('map', { 
    center: [37.02, 22.14], 
    zoom: 12, 
    layers: [satellite] 
});

L.control.layers({ "Satellite": satellite, "Street": street }).addTo(map);

let liveMarker;
// Hover marker follows the Red route when you brush the graph
let hoverMarker = L.circleMarker([0,0], { radius: 6, color: '#ff4444', fillOpacity: 1, zIndexOffset: 1000 }).addTo(map);

// Color swap: Route is Red, Breadcrumbs are Blue
let plannedRouteLine = L.polyline([], { color: '#ff4444', weight: 4, opacity: 0.7 }).addTo(map);
let breadcrumbLine = L.polyline([], { color: '#007bff', weight: 5, opacity: 0.9 }).addTo(map);

let elevationChart;
let routeData = [];
let firstLoad = true;

const SPOT_URL = "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

// --- 2. Load KML & Fix Graph ---
fetch("route.kml")
    .then(res => res.text())
    .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(kmlText, "text/xml");
        const coordsStr = kml.getElementsByTagName("coordinates")[0].textContent.trim();
        
        // Parse "lng,lat,ele" triplets
        routeData = coordsStr.split(/\s+/).map(p => {
            const [lng, lat, ele] = p.split(",").map(Number);
            return { lat, lng, ele };
        });

        if(routeData.length > 0) {
            plannedRouteLine.setLatLngs(routeData.map(p => [p.lat, p.lng]));
            initChart(routeData.map(p => p.ele));
            map.fitBounds(plannedRouteLine.getBounds());
        }
    });

function initChart(elevations) {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    const maxEle = Math.max(...elevations);
    
    elevationChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: elevations.map((_, i) => i),
            datasets: [{
                data: elevations,
                borderColor: '#ff4444',
                backgroundColor: 'rgba(255, 68, 68, 0.1)',
                fill: true,
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { 
                x: { display: false }, 
                y: { 
                    min: 0,
                    suggestedMax: maxEle + 10,
                    ticks: { color: '#666', font: { size: 9 }, stepSize: Math.ceil(maxEle / 5) } 
                } 
            },
            plugins: { legend: { display: false } },
            onHover: (e, el) => {
                if (el.length > 0) {
                    const p = routeData[el[0].index];
                    hoverMarker.setLatLng([p.lat, p.lng]);
                }
            }
        }
    });
}

// --- 3. Live Tracking ---
async function updateTrack() {
    try {
        const res = await fetch(SPOT_URL);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const messages = Array.from(xml.getElementsByTagName("message"));

        if (messages.length === 0) return;

        // Process all messages for the Blue breadcrumb trail
        const history = messages.map(msg => [
            parseFloat(msg.getElementsByTagName("latitude")[0].textContent),
            parseFloat(msg.getElementsByTagName("longitude")[0].textContent)
        ]).reverse();

        breadcrumbLine.setLatLngs(history);

        // Update the marker and stats with the Latest message
        const latest = messages[0]; 
        const latestPos = [
            parseFloat(latest.getElementsByTagName("latitude")[0].textContent),
            parseFloat(latest.getElementsByTagName("longitude")[0].textContent)
        ];

        if (!liveMarker) {
            liveMarker = L.marker(latestPos).addTo(map).bindPopup("Current Position");
        } else {
            liveMarker.setLatLng(latestPos);
        }

        // Dashboard Updates
        document.getElementById('coord-val').innerText = `${latestPos[0].toFixed(5)}, ${latestPos[1].toFixed(5)}`;
        const date = new Date(latest.getElementsByTagName("dateTime")[0].textContent);
        document.getElementById('time-val').innerText = date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('batt-val').innerText = latest.getElementsByTagName("batteryState")[0]?.textContent || "GOOD";

        // Distance & Speed
        let totalDist = 0;
        for(let i=0; i < history.length - 1; i++) {
            totalDist += L.latLng(history[i]).distanceTo(L.latLng(history[i+1]));
        }
        document.getElementById('dist-val').innerText = (totalDist / 1000).toFixed(1) + " km";

        if (messages.length > 1) {
            const p1 = L.latLng(history[history.length-1]);
            const p2 = L.latLng(history[history.length-2]);
            const hrs = Math.abs(new Date(messages[0].getElementsByTagName("dateTime")[0].textContent) - 
                                 new Date(messages[1].getElementsByTagName("dateTime")[0].textContent)) / 36e5;
            document.getElementById('speed-val').innerText = hrs > 0 ? ((p1.distanceTo(p2)/1000)/hrs).toFixed(1) + " km/h" : "0.0 km/h";
        }

        if (firstLoad) {
            map.setView(latestPos, 13);
            firstLoad = false;
        }

    } catch (e) { console.error("Update Error:", e); }
}

setInterval(updateTrack, 60000);
updateTrack();
</script>
</body>
</html>
