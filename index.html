<!DOCTYPE html>
<html>
<head>
  <title>Live Bikepacking Tracker</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
// 🗺️ Init map FIRST
const map = L.map('map').setView([45, 25], 5);

// Base layers
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

// Add default layer
satellite.addTo(map);

// Layer control
L.control.layers({
  "Map": street,
  "Satellite": satellite
}).addTo(map);

// 🔴 YOUR SPOT FEED (already configured)
const SPOT_URL = "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

let marker;
let trackLine = L.polyline([], { color: 'red', weight: 4 }).addTo(map);
let firstLoad = true;

// 🟢 Load your planned route (optional)
fetch("route.kml")
  .then(res => res.text())
  .then(kmlText => {
    const parser = new DOMParser();
    const kml = parser.parseFromString(kmlText, "text/xml");
    const coords = kml.getElementsByTagName("coordinates");

    let latlngs = [];

    for (let c of coords) {
      let points = c.textContent.trim().split(" ");
      points.forEach(p => {
        let [lng, lat] = p.split(",");
        if (lat && lng) {
          latlngs.push([parseFloat(lat), parseFloat(lng)]);
        }
      });
    }

    if (latlngs.length > 0) {
      const routeLine = L.polyline(latlngs, {
        color: 'blue',
        weight: 3,
        opacity: 0.7
      }).addTo(map);

      if (firstLoad) {
        map.fitBounds(routeLine.getBounds());
      }
    }
  });

// 🔄 Fetch SPOT data
async function updateTrack() {
  try {
    const res = await fetch(SPOT_URL);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const messages = xml.getElementsByTagName("message");

    let latlngs = [];

    for (let msg of messages) {
      let lat = msg.getElementsByTagName("latitude")[0]?.textContent;
      let lon = msg.getElementsByTagName("longitude")[0]?.textContent;

      if (lat && lon) {
        latlngs.push([parseFloat(lat), parseFloat(lon)]);
      }
    }

    if (latlngs.length === 0) return;

    // Reverse so oldest → newest (better track drawing)
    latlngs.reverse();

    // Update track line
    trackLine.setLatLngs(latlngs);

    const latest = latlngs[latlngs.length - 1];

    // Update or create marker
    if (!marker) {
      marker = L.marker(latest).addTo(map)
        .bindPopup("📍 Live Location")
        .openPopup();
    } else {
      marker.setLatLng(latest);
    }

    // Center only first time
    if (firstLoad) {
      map.setView(latest, 10);
      firstLoad = false;
    }

  } catch (err) {
    console.error("Error fetching SPOT data:", err);
  }
}

// 🔁 Auto refresh every 30 seconds
setInterval(updateTrack, 30000);
updateTrack();

</script>

</body>
</html>
