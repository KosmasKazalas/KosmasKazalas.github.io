<!DOCTYPE html>
<html>
<head>
    <title>Cross Peloponnese 2026</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: auto; /* Shrink to fit content */
            max-width: calc(100% - 40px);
            pointer-events: none;
        }

        #ui-container > * { pointer-events: auto; }

        /* --- Stats Box (Compact Grid) --- */
        #stats-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: auto auto; /* Tight fit */
            column-gap: 15px;
            row-gap: 8px;
            backdrop-filter: blur(8px);
            width: fit-content;
        }

        /* --- Elevation Drawer (Lag-free Animation) --- */
        #elevation-drawer {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px);
            overflow: hidden;
            width: 160px;
            transition: width 0.25s ease;
        }

        #elevation-drawer.expanded {
            width: 100%; /* Expands within the max-width of UI container */
        }

        #toggle-btn {
            width: 100%;
            height: 40px;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #chart-wrap {
            height: 0;
            overflow: hidden;
            transition: height 0.3s ease-out;
        }

        #elevation-drawer.expanded #chart-wrap {
            height: 180px;
        }

        .stat-item { border-left: 2px solid #007bff; padding-left: 8px; }
        .label { font-size: 8px; color: #777; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 13px; color: #111; font-weight: 800; display: block; white-space: nowrap; }

        /* Mobile specific sizing */
        @media (max-width: 480px) {
            #ui-container { left: 10px; bottom: 10px; }
            #elevation-drawer.expanded #chart-wrap { height: 150px; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-container">
    <div id="elevation-drawer">
        <button id="toggle-btn" onclick="toggleElevation()">📈 Elevation Profile</button>
        <div id="chart-wrap">
            <div style="height:100%; padding:10px;">
                <canvas id="elevationChart"></canvas>
            </div>
        </div>
    </div>

    <div id="stats-box">
        <div class="stat-item"><span class="label">Speed (est)</span><span id="speed-val" class="value">-- km/h</span></div>
        <div class="stat-item"><span class="label">Distance</span><span id="dist-val" class="value">-- km</span></div>
        <div class="stat-item" style="grid-column: span 2;"><span class="label">Latest Coordinates</span><span id="coord-val" class="value">Syncing...</span></div>
        <div class="stat-item"><span class="label">Last Update</span><span id="time-val" class="value">--:--</span></div>
        <div class="stat-item"><span class="label">Battery</span><span id="batt-val" class="value">--</span></div>
    </div>
</div>

<script>
function toggleElevation() {
    const drw = document.getElementById('elevation-drawer');
    const btn = document.getElementById('toggle-btn');
    drw.classList.toggle('expanded');
    btn.innerText = drw.classList.contains('expanded') ? "✕ Close Profile" : "📈 Elevation Profile";
}

const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
const map = L.map('map', { zoomControl: true, layers: [satellite] });
L.control.layers({ "Satellite": satellite, "Street": street }).addTo(map);

let liveMarker, hoverMarker = L.circleMarker([0,0], { radius: 6, color: '#ff4444', fillColor: 'white', fillOpacity: 1, weight: 3 }).addTo(map);
let plannedRouteLine = L.polyline([], { color: '#ff4444', weight: 4, opacity: 0.7 }).addTo(map);
let breadcrumbLine = L.polyline([], { color: '#007bff', weight: 5, opacity: 0.9 }).addTo(map);
let elevationChart, routeData = [];

const SPOT_URL = "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

fetch("route.kml").then(r => r.text()).then(txt => {
    const kml = new DOMParser().parseFromString(txt, "text/xml");
    const coordsStr = kml.getElementsByTagName("coordinates")[0].textContent.trim();
    let acc = 0;
    routeData = coordsStr.split(/\s+/).map((p, i, arr) => {
        const [lng, lat, ele] = p.split(",").map(Number);
        if (i > 0) {
            const prev = arr[i-1].split(",").map(Number);
            acc += L.latLng(lat, lng).distanceTo(L.latLng(prev[1], prev[0]));
        }
        return { lat, lng, ele, dist: (acc / 1000).toFixed(1) };
    });
    plannedRouteLine.setLatLngs(routeData.map(p => [p.lat, p.lng]));
    initChart();
    map.fitBounds(plannedRouteLine.getBounds(), { padding: [20, 20] });
});

function initChart() {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    const elevs = routeData.map(p => p.ele);
    const maxE = Math.max(...elevs);
    elevationChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: routeData.map(p => p.dist),
            datasets: [{ data: elevs, borderColor: '#ff4444', backgroundColor: 'rgba(255, 68, 68, 0.1)', fill: true, pointRadius: 0, borderWidth: 2, tension: 0.1 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: { x: { display: false }, y: { min: 0, suggestedMax: maxE + 10, ticks: { size: 9 } } },
            plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { title: (i) => i[0].label + ' km', label: (c) => c.parsed.y + ' m' } } },
            onHover: (e, el) => { if (el.length > 0) hoverMarker.setLatLng([routeData[el[0].index].lat, routeData[el[0].index].lng]); }
        }
    });
}

async function updateTrack() {
    try {
        const res = await fetch(SPOT_URL);
        const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
        const messages = Array.from(xml.getElementsByTagName("message"));
        if (!messages.length) return;

        const all = messages.map(m => ({
            lat: parseFloat(m.getElementsByTagName("latitude")[0].textContent),
            lng: parseFloat(m.getElementsByTagName("longitude")[0].textContent),
            time: new Date(m.getElementsByTagName("dateTime")[0].textContent),
            batt: m.getElementsByTagName("batteryState")[0]?.textContent || "GOOD"
        })).reverse();

        const latst = all[all.length - 1];
        if (!liveMarker) liveMarker = L.marker([latst.lat, latst.lng]).addTo(map);
        else liveMarker.setLatLng([latst.lat, latst.lng]);

        document.getElementById('coord-val').innerText = `${latst.lat.toFixed(4)}, ${latst.lng.toFixed(4)}`;
        document.getElementById('time-val').innerText = latst.time.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('batt-val').innerText = latst.batt;

        const start = L.latLng(37.0203, 22.1433); 
        let started = false;
        const valid = all.filter(p => {
            if (L.latLng(p.lat, p.lng).distanceTo(start) < 2000) started = true;
            return started;
        });

        if (valid.length) {
            breadcrumbLine.setLatLngs(valid.map(p => [p.lat, p.lng]));
            let d = 0;
            for(let i=0; i<valid.length-1; i++) d += L.latLng(valid[i]).distanceTo(L.latLng(valid[i+1]));
            document.getElementById('dist-val').innerText = (d/1000).toFixed(1) + " km";
        } else {
            document.getElementById('dist-val').innerText = "0.0 km";
        }

        if (all.length > 1) {
            const p1 = all[all.length-1], p2 = all[all.length-2];
            const hrs = Math.abs(p1.time - p2.time) / 36e5;
            const km = L.latLng(p1.lat, p1.lng).distanceTo(L.latLng(p2.lat, p2.lng)) / 1000;
            document.getElementById('speed-val').innerText = (hrs > 0 && hrs < 2.5) ? (km/hrs).toFixed(1) + " km/h" : "0.0 km/h";
        }
    } catch (e) { console.error(e); }
}
setInterval(updateTrack, 60000);
updateTrack();
</script>
</body>
</html>
