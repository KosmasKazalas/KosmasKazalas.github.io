<!DOCTYPE html>
<html>
<head>
    <title>Live Bikepacking Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; }

        /* 📊 Responsive Dashboard Layout */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 450px;
        }

        #stats-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        #elevation-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            height: 130px;
            backdrop-filter: blur(5px);
        }

        .stat-item { border-left: 3px solid #ff4444; padding-left: 8px; }
        .label { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 14px; color: #111; font-weight: 800; display: block; }
        
        /* 🚲 Marker Pulse Effect */
        .bike-dot {
            width: 12px;
            height: 12px;
            background: #ff4444;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-container">
    <div id="elevation-box">
        <canvas id="elevationChart"></canvas>
    </div>

    <div id="stats-box">
        <div class="stat-item">
            <span class="label">Speed (est)</span>
            <span id="speed-val" class="value">-- km/h</span>
        </div>
        <div class="stat-item">
            <span class="label">Distance Traveled</span>
            <span id="dist-val" class="value">-- km</span>
        </div>
        <div class="stat-item" style="grid-column: span 2;">
            <span class="label">Latest Coordinates</span>
            <span id="coord-val" class="value">Waiting for GPS...</span>
        </div>
        <div class="stat-item">
            <span class="label">Last Update</span>
            <span id="time-val" class="value">--:--</span>
        </div>
        <div class="stat-item">
            <span class="label">Battery Status</span>
            <span id="batt-val" class="value">--</span>
        </div>
    </div>
</div>

<script>
// --- 1. Map Initialization ---
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const map = L.map('map', { 
    center: [45, 25], 
    zoom: 5, 
    layers: [satellite] 
});

// Restore Layer Control
L.control.layers({ "Satellite": satellite, "Street": street }).addTo(map);

let liveMarker;
let hoverMarker = L.circleMarker([0,0], { radius: 6, color: '#007bff', fillOpacity: 1 }).addTo(map);
let trackLine = L.polyline([], { color: '#ff4444', weight: 4, opacity: 0.8 }).addTo(map);
let elevationChart;
let routeData = [];
let firstLoad = true;

const SPOT_URL = "https://api.allorigins.win/raw?url=https://api.findmespot.com/spot-main-web/consumer/rest-api/2.0/public/feed/0q9neniSu2ZeyQnhvBGPjWiqvDFJd3sEO/message.xml";

// --- 2. Load Planned Route & Graph ---
fetch("route.kml")
    .then(res => res.text())
    .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(kmlText, "text/xml");
        const coords = Array.from(kml.getElementsByTagName("coordinates"));
        
        let rawPoints = [];
        coords.forEach(c => {
            let pts = c.textContent.trim().split(/\s+/);
            pts.forEach(p => {
                let [lng, lat, ele] = p.split(",");
                if(lat && lng) rawPoints.push({ lat: parseFloat(lat), lng: parseFloat(lng), ele: parseFloat(ele) || 0 });
            });
        });

        routeData = rawPoints;
        if(routeData.length > 0) {
            initChart(routeData.map((_, i) => i), routeData.map(p => p.ele));
            L.polyline(routeData.map(p => [p.lat, p.lng]), { color: '#007bff', weight: 3, opacity: 0.4 }).addTo(map);
        }
    }).catch(e => console.warn("Planned route.kml not found."));

function initChart(labels, data) {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    elevationChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                fill: true,
                pointRadius: 0,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { x: { display: false }, y: { ticks: { color: '#666', font: { size: 9 } } } },
            plugins: { legend: { display: false } },
            onHover: (e, el) => {
                if (el.length > 0) {
                    const p = routeData[el[0].index];
                    hoverMarker.setLatLng([p.lat, p.lng]);
                }
            }
        }
    });
}

// --- 3. Live Tracking & Breadcrumbs ---
async function updateTrack() {
    try {
        const res = await fetch(SPOT_URL);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const messages = Array.from(xml.getElementsByTagName("message"));

        if (messages.length === 0) return;

        // "Breadcrumbs" - get all points from feed
        const breadcrumbs = messages.map(msg => [
            parseFloat(msg.getElementsByTagName("latitude")[0].textContent),
            parseFloat(msg.getElementsByTagName("longitude")[0].textContent)
        ]).reverse();

        trackLine.setLatLngs(breadcrumbs);

        // Latest Location (the newest message)
        const latestMsg = messages[0]; 
        const latestPos = [
            parseFloat(latestMsg.getElementsByTagName("latitude")[0].textContent),
            parseFloat(latestMsg.getElementsByTagName("longitude")[0].textContent)
        ];

        // Update Marker (Stays at latest pos even if you sleep)
        if (!liveMarker) {
            liveMarker = L.marker(latestPos).addTo(map).bindPopup("<b>Latest Position</b>").openPopup();
        } else {
            liveMarker.setLatLng(latestPos);
        }

        // Stats Update
        document.getElementById('coord-val').innerText = `${latestPos[0].toFixed(5)}, ${latestPos[1].toFixed(5)}`;
        const date = new Date(latestMsg.getElementsByTagName("dateTime")[0].textContent);
        document.getElementById('time-val').innerText = date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('batt-val').innerText = latestMsg.getElementsByTagName("batteryState")[0]?.textContent || "NORMAL";

        // Distance & Speed
        let totalDist = 0;
        for(let i=0; i < breadcrumbs.length - 1; i++) {
            totalDist += L.latLng(breadcrumbs[i]).distanceTo(L.latLng(breadcrumbs[i+1]));
        }
        document.getElementById('dist-val').innerText = (totalDist / 1000).toFixed(1) + " km";

        if (messages.length > 1) {
            const p1 = L.latLng(breadcrumbs[breadcrumbs.length-1]);
            const p2 = L.latLng(breadcrumbs[breadcrumbs.length-2]);
            const t1 = new Date(messages[0].getElementsByTagName("dateTime")[0].textContent);
            const t2 = new Date(messages[1].getElementsByTagName("dateTime")[0].textContent);
            const hrs = Math.abs(t1 - t2) / 36e5;
            const speed = hrs > 0 ? (p1.distanceTo(p2) / 1000) / hrs : 0;
            document.getElementById('speed-val').innerText = speed.toFixed(1) + " km/h";
        }

        if (firstLoad) {
            map.setView(latestPos, 10);
            firstLoad = false;
        }

    } catch (e) { console.error("Update Error:", e); }
}

setInterval(updateTrack, 60000);
updateTrack();

</script>
</body>
</html>
